<!DOCTYPE html>
<html>
    <head>
        <title>Manipulando Textos</title>
    </head>
    <body>
        <h1>Titulo do Site</h1>
        <h2>Título do Site 02</h2>
        <h3>Título do Site 03</h3>
        <h4>Título do Site 04</h4>
        <h5>Título do Site 05</h5>
        <h6>Título do Site 06</h6>
        <p>Olá este texto é um <b>exemplo</b> de um paragráfo</p>
        <b>Texto em Negrito</b>
        <br>
        <i>Texto em ítalico</i>
        <br>
        <u>Texto Sublinhado</u>
        <br>
        <em>Texto enfatizado</em>
        <br>
        <small>Texto Pequeno</small>
        <br>
        <span>Texto puro de formatação</span>
    </body>
</html>
